<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lutong Bahai | Home</title>
    <link href="https://fonts.cdnfonts.com/css/aileron" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/fredoka" rel="stylesheet" />
    <link rel="stylesheet" href="nav.css" />
    <link rel="icon" type="image/svg+xml" href="pic/Logo.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Aileron", sans-serif;
        background-color: #f7f3e8;
      }

      .navbar {
        background-color: transparent;
        border-radius: 0;
        box-shadow: none;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
        z-index: 1000;
      }

      .navbar-content {
        max-width: 1400px;
        margin: 0 auto;
        padding: 10px 40px;
        height: 80px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .navbar-background-wrap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.7);
        border-radius: 0 0 40px 40px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        z-index: -1;
      }

      .logo-placeholder img {
        height: 70px;
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 40px;
        text-transform: lowercase;
        align-items: center;
        margin-right: 20px;
      }

      .nav-links li {
        padding: 0;
        font-size: 1.2em;
        font-weight: 600;
        color: #555;
      }

      .nav-links a {
        text-decoration: none;
        color: #555;
        padding-bottom: 5px;
        transition: color 0.3s;
        font-family: "Fredoka", sans-serif;
      }

      .nav-links .active,
      .nav-links a:hover {
        color: #e47c82;
        border-bottom: 2px solid #e47c82;
      }

      .nav-links li:last-child a:hover {
        border-bottom: none;
      }

      main {
        padding-top: 80px;
      }

      .hero-section,
      .features-section {
        min-height: 80vh;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }

      .hero-content {
        padding: 50px 0;
      }

      .hero-content h1 {
        font-size: 5em;
        color: #f06292;
        text-shadow: 2px 2px #fff;
        letter-spacing: 5px;
      }

      .hero-content .subtitle {
        font-size: 1.2em;
        color: #555;
        margin-bottom: 30px;
      }

      .camera-graphic {
        width: 150px;
        height: 150px;
        background: #eee;
        border-radius: 50%;
        margin: 20px auto;
        border: 5px solid #ffa3c6;
        line-height: 150px;
        color: #333;
        font-size: 0.8em;
      }

      .start-button {
        padding: 10px 30px;
        background-color: #ffa3c6;
        border: none;
        border-radius: 50px;
        color: white;
        font-size: 1.2em;
        cursor: pointer;
        margin-top: 20px;
        transition: background-color 0.3s;
        text-transform: uppercase;
        font-weight: bold;
      }

      .start-button:hover {
        background-color: #f06292;
      }

      .as-of {
        margin-top: 10px;
        font-size: 0.9em;
        color: #888;
      }


      .footer-logo-placeholder {
        height: 30px;
        margin-bottom: 5px;
        font-size: 1.3em;
        color: #000000;
        color: #666;
        font-family: "Aileron", sans-serif;
      }

      .copyright {
        font-size: 0.9em;
        color: #666;
        font-family: "Aileron", sans-serif;
      }
      .start-button-custom {
        padding: 10px 40px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        display: inline-block;

        background-color: #e47c82;
        color: white;
        font-family: "Fredoka", sans-serif;
        font-size: 1.9em;
        font-weight: 700;
        text-transform: uppercase;
        text-decoration: none;

        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-background-wrap"></div>
      <div class="navbar-content">
        <div class="logo-placeholder">
          <img src="pic/logo.png" alt="Lutong Bahai Logo" />
        </div>

        <ul class="nav-links">
          <li><a href="/index" class="active">home</a></li>
          <li><a href="/about">about</a></li>
          <li><a href="/camera">camera</a></li>
          <li><a href="/scope">manual</a></li>
          <li><a href="/support">support us</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <section
        class="hero-section"
        style="background-image: url('pic/first.png')"
      >
        <br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
        <a href="/camera" class="start-button-custom">START</a>
      </section>

      <section
        class="features-section"
        style="background-image: url('pic/second.png')"
      ></section>
    </main>

    <footer class="footer">
      <br />
      <div class="footer-logo-placeholder">Baura Co.</div>
      <p class="copyright">Copyright 2025. Baura Co. All Rights Reserved.</p>
    </footer>
  </body>
</html>
