<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lutong Bahai | Support Us</title>
    <link href="https://fonts.cdnfonts.com/css/aileron" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/fredoka" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="pic/Logo.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Aileron", sans-serif;
        background-color: #f7f3e8;
        background-image: url("pic/bg2.png");
        background-repeat: repeat;
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .navbar {
        background-color: transparent;
        border-radius: 0;
        box-shadow: none;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
        z-index: 1000;
      }

      .navbar-content {
        max-width: 1400px;
        margin: 0 auto;
        padding: 10px 40px;
        height: 80px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .navbar-background-wrap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.7);
        border-radius: 0 0 40px 40px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        z-index: -1;
      }

      .logo-placeholder img {
        height: 70px;
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 40px;
        text-transform: lowercase;
        align-items: center;
        margin-right: 20px;
      }

      .nav-links li {
        padding: 0;
        font-size: 1.2em;
        font-weight: 600;
        color: #555;
      }

      .nav-links a {
        text-decoration: none;
        color: #555;
        padding-bottom: 5px;
        transition: color 0.3s;
        font-family: "Fredoka", sans-serif;
      }

      .nav-links .active {
        color: #e47c82;
        border-bottom: 2px solid #e47c82;
      }

      .nav-links a:hover {
        color: #e47c82;
        border-bottom: 2px solid #e47c82;
      }

      .nav-links li:last-child a:hover {
        border-bottom: none;
      }

      main {
  padding-top: 100px;
  /* Change min-height to flex-grow */
  /* min-height: calc(100vh - 100px); */ 
  flex-grow: 1; /* Pushes the footer down */
  display: flex; /* Keep the existing flex layout inside main */
  flex-direction: column; 
  justify-content: center;
  align-items: center;
}

      .card-container {
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        flex-wrap: wrap;
      }

      .card {
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 25px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        width: 45%;
        max-width: 550px;
        min-height: 400px;
        flex-grow: 1;
      }

      .image-card {
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .image-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 25px;
      }

      /* Right Card: Content (About Us Text) */
      .content-card {
        padding: 60px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .footer {
  padding: 10px;
  background-color: white;
  text-align: center;
  border-top: 1px solid #eee;
  /* FIX: Add these styles */
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 1000; /* Recommended to ensure it sits on top */
}

      .footer-logo-placeholder {
        height: 30px;
        margin-bottom: 5px;
        font-size: 1.3em;
        color: #666;
        font-family: "Aileron", sans-serif;
      }

      .copyright {
        font-size: 0.9em;
        color: #666;
        font-family: "Aileron", sans-serif;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-background-wrap"></div>
      <div class="navbar-content">
        <div class="logo-placeholder">
          <img src="pic/logo.png" alt="Lutong Bahai Logo" />
        </div>

        <ul class="nav-links">
          <li><a href="/index">home</a></li>
          <li><a href="/about">about</a></li>
          <li><a href="/camera">camera</a></li>
          <li><a href="/scope">manual</a></li>
          <li><a href="/support" class="active">support us</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <div class="card-container">
        <section class="card image-card">
          <img src="pic/qr.png" alt="Lutong BahAI Poster" />
        </section>
      </div>
    </main>

    <footer class="footer">
      <br />
      <div class="footer-logo-placeholder">Baura Co.</div>
      <p class="copyright">Copyright 2025. Baura Co. All Rights Reserved.</p>
    </footer>
  </body>
</html>
