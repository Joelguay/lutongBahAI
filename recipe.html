<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe</title>
    <style>
      body {
        font-family: "Aileron", sans-serif;
        background-color: #f7f3e8;
        background-image: url("pic/bg2.png");
        background-repeat: repeat;
        background-attachment: fixed;
        margin: 0;
        padding: 2rem;
        color: #e47c82;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
      }
      .back-link {
        color: #e47c82;
        text-decoration: none;
        border: 1px solid #e47c82;
        padding: 8px 14px;
        border-radius: 9999px;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 1.5rem;
      }

      /* Structured Recipe Display Styles */
      .recipe-details {
        color: #e5e7eb;
        line-height: 1.6;
      }

      .servings-info {
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 2rem;
        font-size: 1.1rem;
      }

      .ingredients-section,
      .instructions-section,
      .notes-section {
        margin-bottom: 2rem;
      }

      .ingredients-section h3,
      .instructions-section h3,
      .notes-section h3 {
        color: #f8fafc;
        margin-bottom: 1rem;
        font-size: 1.3rem;
        border-bottom: 2px solid rgba(251, 191, 36, 0.3);
        padding-bottom: 0.5rem;
      }

      .ingredients-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .ingredient-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 8px;
        transition: background-color 0.2s;
      }

      .ingredient-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .instructions-list {
        counter-reset: step-counter;
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .instruction-step {
        counter-increment: step-counter;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
        position: relative;
      }

      .instruction-step::before {
        content: counter(step-counter);
        position: absolute;
        left: -10px;
        top: 20px;
        background: #fbbf24;
        color: #0f172a;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.9rem;
      }

      .step-title {
        font-weight: 600;
        color: #f8fafc;
        margin-bottom: 8px;
        font-size: 1.1rem;
        margin-left: 20px;
      }

      .step-details {
        list-style: none;
        padding: 0;
        margin: 0;
        margin-left: 20px;
      }

      .step-detail {
        background: rgba(255, 255, 255, 0.03);
        border-left: 3px solid #e47c82;
        padding: 8px 12px;
        margin-bottom: 6px;
        border-radius: 0 6px 6px 0;
      }

      .notes-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .note-item {
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.2);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 8px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Generated Recipes</h1>
        <a class="back-link" href="index.html">← Back</a>
      </div>
      <div class="card">
        <div id="status">Loading recipes…</div>
        <div id="list-section" style="margin-top: 1rem">
          <ul
            id="recipe-list"
            style="list-style: none; padding-left: 0; margin: 0"
          ></ul>
        </div>
        <div id="steps-section" style="display: none; margin-top: 1rem">
          <h2 id="selected-name" style="margin-top: 0.5rem"></h2>
          <ol id="steps-list" style="margin-top: 0.5rem"></ol>
          <button id="back-to-list" class="back-link" style="margin-top: 1rem">
            ← Back to List
          </button>
        </div>
      </div>
      <script>
        (function () {
          const apiBase = "http://localhost:5000";

          const statusEl = document.getElementById("status");
          const listSection = document.getElementById("list-section");
          const listEl = document.getElementById("recipe-list");
          const stepsSection = document.getElementById("steps-section");
          const stepsList = document.getElementById("steps-list");
          const selectedNameEl = document.getElementById("selected-name");
          const backBtn = document.getElementById("back-to-list");

          function setStatus(text) {
            if (!text) {
              statusEl.style.display = "none";
              return;
            }
            statusEl.style.display = "block";
            statusEl.textContent = text;
          }

          async function loadRecipes() {
            setStatus("Loading recipes…");
            stepsSection.style.display = "none";
            listSection.style.display = "block";
            listEl.innerHTML = "";
            try {
              const res = await fetch(`${apiBase}/getRecipeByInd`);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();
              const recipes = Array.isArray(data.recipes)
                ? data.recipes.slice(0, 5)
                : [];
              if (recipes.length === 0) throw new Error("No recipes found.");
              recipes.forEach((r) => {
                const li = document.createElement("li");
                li.style.padding = "10px 12px";
                li.style.marginBottom = "8px";
                li.style.border = "1px solid rgba(255,255,255,0.15)";
                li.style.borderRadius = "12px";
                li.style.display = "flex";
                li.style.alignItems = "center";
                li.style.justifyContent = "space-between";

                const info = document.createElement("div");
                const name = document.createElement("div");
                name.textContent = r.name || "Untitled Dish";
                name.style.fontWeight = "600";
                const desc = document.createElement("div");
                desc.textContent = r.description || "";
                desc.style.opacity = "0.8";
                desc.style.fontSize = "0.95rem";
                info.appendChild(name);
                info.appendChild(desc);

                const btn = document.createElement("button");
                btn.textContent = "View Steps";
                btn.className = "back-link";
                btn.style.cursor = "pointer";
                btn.addEventListener("click", () => selectRecipe(r.name));

                li.appendChild(info);
                li.appendChild(btn);
                listEl.appendChild(li);
              });
              setStatus("");
            } catch (err) {
              console.error(err);
              setStatus(
                "Failed to load recipes. Ensure the Python API server is running on http://localhost:5173."
              );
            }
          }

          async function selectRecipe(recipeName) {
            if (!recipeName) return;
            setStatus("Loading steps…");
            try {
              const res = await fetch(
                `${apiBase}/getRecipeByDish?recipe_val=${encodeURIComponent(
                  recipeName
                )}`
              );
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();

              // Clear previous content
              stepsList.innerHTML = "";

              // Display servings if available
              if (data.servings) {
                const servingsDiv = document.createElement("div");
                servingsDiv.className = "servings-info";
                servingsDiv.innerHTML = `<strong>Servings:</strong> ${data.servings}`;
                stepsList.appendChild(servingsDiv);
              }

              // Display ingredients
              if (data.ingredients && data.ingredients.length > 0) {
                const ingredientsSection = document.createElement("div");
                ingredientsSection.className = "ingredients-section";
                ingredientsSection.innerHTML = "<h3>Ingredients:</h3>";

                const ingredientsList = document.createElement("ul");
                ingredientsList.className = "ingredients-list";
                data.ingredients.forEach((ingredient) => {
                  const li = document.createElement("li");
                  li.className = "ingredient-item";
                  li.textContent = ingredient;
                  ingredientsList.appendChild(li);
                });

                ingredientsSection.appendChild(ingredientsList);
                stepsList.appendChild(ingredientsSection);
              }

              // Display instructions
              if (data.instructions && data.instructions.length > 0) {
                const instructionsSection = document.createElement("div");
                instructionsSection.className = "instructions-section";
                instructionsSection.innerHTML =
                  "<h3>Step-by-Step Cooking Instructions:</h3>";

                const instructionsList = document.createElement("ol");
                instructionsList.className = "instructions-list";
                data.instructions.forEach((step, index) => {
                  const li = document.createElement("li");
                  li.className = "instruction-step";

                  const stepTitle = document.createElement("div");
                  stepTitle.className = "step-title";
                  stepTitle.textContent = step.title;
                  li.appendChild(stepTitle);

                  if (step.details && step.details.length > 0) {
                    const detailsList = document.createElement("ul");
                    detailsList.className = "step-details";
                    step.details.forEach((detail) => {
                      const detailLi = document.createElement("li");
                      detailLi.className = "step-detail";
                      detailLi.textContent = detail;
                      detailsList.appendChild(detailLi);
                    });
                    li.appendChild(detailsList);
                  }

                  instructionsList.appendChild(li);
                });

                instructionsSection.appendChild(instructionsList);
                stepsList.appendChild(instructionsSection);
              }

              // Display notes if available
              if (data.notes && data.notes.length > 0) {
                const notesSection = document.createElement("div");
                notesSection.className = "notes-section";
                notesSection.innerHTML = "<h3>Tips & Notes:</h3>";

                const notesList = document.createElement("ul");
                notesList.className = "notes-list";
                data.notes.forEach((note) => {
                  const li = document.createElement("li");
                  li.className = "note-item";
                  li.textContent = note;
                  notesList.appendChild(li);
                });

                notesSection.appendChild(notesList);
                stepsList.appendChild(notesSection);
              }

              selectedNameEl.textContent = data.name || recipeName;
              listSection.style.display = "none";
              stepsSection.style.display = "block";
              setStatus("");
            } catch (err) {
              console.error(err);
              setStatus("Failed to load recipe steps.");
            }
          }

          backBtn.addEventListener("click", () => {
            stepsSection.style.display = "none";
            listSection.style.display = "block";
            setStatus("");
          });

          // Kick off
          loadRecipes();
        })();
      </script>
    </div>
  </body>
</html>
